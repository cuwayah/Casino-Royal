  const act=s.k=='me'?'onclick="stand()" title="Aufstehen"':npc&&s.peer==me?`onclick="removeNpc(${i})" title="NPC entfernen"`:'';
  return `<div class="seat${tx&&tx.cls?' '+tx.cls:''}" ${pos}><div class="mc">${tx?tx.mc:cd.map(n=>cardH(i2c(n),'',-1)).join('')}</div><button class="av on${s.k=='me'?' me':''}" style="--col:${col}" ${act}>${esc((nm||'?')[0].toUpperCase())}${(!npc&&m.rd)?'<span class="rdy">✓</span>':''}${r!=null?`<span class="rs ${r>0?'g':r<0?'b':''}">${r>0?'+':''}${r}</span>`:''}</button><div class="nm">${esc(nm)}${npc?' 🤖':''}</div>${tx?`<div class="sb">${tx.l1}</div><div class="sb">${tx.l2}</div>`:`<div class="sb">${npc?'':'🪙 '+(m.c??'')}</div><div class="sb">${npc?'':esc(m.s||'')}</div>`}</div>`}).join('');
 if(el.dataset.h!==h){el.dataset.h=h;el.innerHTML=h}}
function goBtn(){const e=$('#go');if(!e)return;const h=readyUI(true)||'';if(e.dataset.h!==h){e.dataset.h=h;e.innerHTML=h}}
function startRound(){if(anim||(BJ.active&&Date.now()-BJ.t0<80000)||TX.on||ROY.active||!needSeat()||!isHost())return;if(seatHumans().length>1&&!readyAll()){say('Alle Spieler müssen erst auf „Bereit“ drücken.');return}const me=mpMe().peer,bets={},npc=[];
 seatHumans().forEach(s=>{const c2=cur=='bj'||cur=='tex'||cur=='royal';if(c2||s.m.k!=null)bets[s.peer]=[c2?null:s.m.k,cur=='tex'||cur=='royal'?bet:(s.m.b||bet)]});
 if(!Object.keys(bets).length){say('Setze zuerst deinen Tipp.');return}
 seatData().forEach((s,i)=>{if(s&&s.k=='npc')npc.push({i,b:bet,k:cur=='coin'?rnd(2):cur=='horse'?rnd(6):cur=='peng'?+(1.2+Math.random()*4).toFixed(1):['red','black','even','odd','n'+(1+rnd(36))][rnd(5)]})});
 if(cur=='tex'&&Object.keys(bets).length+npc.length<2){say('Poker braucht mindestens 2 Spieler: setz per 🤖 NPC einen Bot dazu oder lade einen Freund ein.');return}
 mpPush({hs:{g:cur,r:Date.now(),seed:Math.random()*2147483647|0,ps:Object.keys(bets),bets,npc,bb:bet}});setMp({rd:0});MPR.rdLock=Date.now()+4500;seatTick()}
function runRound(hs){setMp({rd:0});({bj:bjBegin,coin:coinRound,roul:roulRound,horse:horseRound,peng:pengBegin,tex:texBegin,royal:royBegin})[cur]?.(hs)}
function seatTick(){if(!MP.mp)return;const me=mpMe().peer;let arr=seatData();const mi=MP.mp.i;
 if(mi!=null&&arr[mi]&&arr[mi].peer!=me){const f=[2,1,3,0,4].find(i=>!arr[i]);setMp({i:f==null?null:f});arr=seatData()}
 if(MP.mp.c!==coins)setMp({c:coins});renderSeats(arr);
 const h=mpHost();if(h){const hs=h.presence.hs;if(hs&&hs.g==cur&&hs.r!==MPR.lastR&&hs.r>MPR.since-5000&&!anim){MPR.lastR=hs.r;runRound(hs)}}
 if(BJ.active&&!BJ.settled)bjCheck();if(cur=='tex')txTick();if(isHost()&&seatHumans().length>1&&SHARED.includes(cur)&&readyAll()&&!anim&&Date.now()>(MPR.rdLock||0)){MPR.rdLock=Date.now()+4500;startRound()}
 if(!anim){if(cur=='bj'&&!BJ.active&&!BJ.show)bjIdle();if(cur=='tex'&&!TX.on)texIdle();if(cur=='royal'&&!ROY.active&&!ROY.show)royIdle();if(['coin','roul','horse','peng'].includes(cur))goBtn()}}
function webRoom(){let id;try{id=sessionStorage.getItem('kid');if(!id){id=Math.random().toString(36).slice(2,12);sessionStorage.setItem('kid',id)}}catch(e){id=Math.random().toString(36).slice(2,12)}
 const rn=(new URLSearchParams(location.search).get('room')||'main').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,32)||'main',peers=new Map(),cbs=[],mine={};
 const post=pr=>fetch('/presence',{method:'POST',body:JSON.stringify({id,room:rn,presence:pr})}).catch(()=>{});
 const es=new EventSource('/events?id='+id+'&room='+rn);es.onopen=()=>{if(Object.keys(mine).length)post(mine)};
 es.onmessage=e=>{peers.clear();JSON.parse(e.data).forEach(p=>peers.set(p.id,p.presence));cbs.forEach(f=>f())};
 const rp=$('#rmp');if(rp){rp.style.display='';$('#rmn').textContent=rn}
 return{peers:()=>{const a=[...peers.entries()].filter(([k])=>k!=id).map(([k,v])=>({peer:k,kind:'viewer',isMe:false,sameTab:false,presence:v}));a.push({peer:id,kind:'viewer',isMe:true,sameTab:true,presence:{...(peers.get(id)||{}),...mine}});return a},
  presence:pr=>{Object.assign(mine,pr);post(pr);return Promise.resolve()},onPeers:f=>{cbs.push(f)}}}
(async()=>{try{if(window.claude&&window.claude.use)room=await window.claude.use('room');else if(location.protocol.startsWith('http'))room=webRoom()}catch(e){room=null}
 if(room){room.onPeers(()=>{seatTick();ptTick()},()=>{});room.presence({mp:MP.mp,np:MP.np}).catch(()=>{})}})();
setInterval(seatTick,800);setInterval(ptTick,500);
$('#mpn').value=MP.mp.n;
setBet(50);go('bj');menuOpen('main');
</script></body></html>
